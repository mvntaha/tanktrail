name: tanktrail
description: "TankTrail: shared-vehicle fuel and trip logger"
publish_to: 'none'

# versionName+versionCode on Android. Bump the +N for every APK given to drivers.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Versions pinned exactly after checking pub.dev (see CLAUDE.md: verify before use).
dependencies:
  flutter:
    sdk: flutter
  # Material widgets now ship as a package; go_router 18 builds on it too.
  material_ui: 1.5.0
  firebase_core: 4.15.0
  firebase_auth: 6.7.0
  cloud_firestore: 6.10.0
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  camera: 0.12.1
  geolocator: 14.1.1
  path_provider: 2.1.6
  drift: 2.35.1
  drift_flutter: 0.3.1
  crypto: 3.0.7
  flutter_image_compress: 2.5.1
  google_mlkit_text_recognition: 0.17.1
  image: 4.10.1
  background_downloader: 9.6.3
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-phone tests (e.g. the OCR sample test): flutter test integration_test/...
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.1
  fake_cloud_firestore: 4.3.0

flutter:
  uses-material-design: true

  # Inter is bundled (SIL Open Font License, see assets/fonts/Inter-LICENSE.txt);
  # no runtime font downloads.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
