name: tanktrail
description: "TankTrail: shared-vehicle fuel and trip logger"
publish_to: 'none'

# versionName+versionCode on Android. Bump the +N for every APK given to drivers.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Versions pinned exactly after checking pub.dev (see CLAUDE.md: verify before use).
dependencies:
  flutter:
    sdk: flutter
  # Material widgets now ship as a package; go_router 18 builds on it too.
  material_ui: 1.5.0
  firebase_core: 4.15.0
  firebase_auth: 6.7.0
  cloud_firestore: 6.10.0
  flutter_riverpod: 3.4.3
  go_router: 18.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter is bundled (SIL Open Font License, see assets/fonts/Inter-LICENSE.txt);
  # no runtime font downloads.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
